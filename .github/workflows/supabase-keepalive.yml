name: Supabase keep-alive

# Free-tier Supabase projects pause after about a week without database
# activity. This calls the tiny ping() function every 3 days to prevent that.
# Note: GitHub disables scheduled workflows in public repos after 60 days
# without commits — re-enable it from the Actions tab if that happens.

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:   # "Run workflow" button for a manual test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ping database
        run: |
          set -a; source .env.production; set +a
          curl -sSf -X POST "$VITE_SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo

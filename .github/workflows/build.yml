name: Build check

# Deployment is handled by Cloudflare Pages' Git integration (project
# "campaign-orchestrator" → vtm-shanghai.pages.dev): it builds every push,
# main → production, other branches → preview URLs. Build settings live in
# the Cloudflare dashboard; Supabase settings come from .env.production.
#
# This workflow only verifies that the app builds.

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CF_PAGES: '1'

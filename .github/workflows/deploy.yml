name: Build & Deploy to Cloudflare Pages

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CF_PAGES: '1'
          # Public Supabase settings — set under GitHub repo Settings → Secrets and variables → Actions → Variables
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # Cloudflare Pages deployment
      # Note: You also need to connect the repo in the Cloudflare dashboard.
      # This step provides an alternative deploy method via GitHub Actions.
      # To use it, set these secrets in GitHub repo settings:
      #   CLOUDFLARE_API_TOKEN — API token with Cloudflare Pages permissions
      #   CLOUDFLARE_ACCOUNT_ID — your Cloudflare account ID
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=map-app
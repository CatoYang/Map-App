<!DOCTYPE html>
<html>
<body>
  <div id="detail-panel"></div>
  <script type="module">
    import { DetailPanel } from './src/features/DetailPanel.js';
    const dp = new DetailPanel('detail-panel');
    const props = {
      OBJECTID: 5,
      NAME: "East Police Station (Poste de L'est)",
      F_ADDRESS: '180 QUAI DE FRANCE',
      START: 0,
      END_: 0
    };
    try {
      dp.showPin(props);
      console.log('Success! HTML:', document.getElementById('detail-panel').innerHTML);
    } catch(e) {
      console.error('Error!', e);
    }
  </script>
</body>
</html>
